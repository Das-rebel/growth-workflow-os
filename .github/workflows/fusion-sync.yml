name: Sync Fusion Tasks
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sync_fusion_tasks.sh
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Fusion tasks to cloud dashboard
        env:
          FUSION_BEARER_TOKEN: ${{ secrets.FUSION_BEARER_TOKEN }}
        run: |
          chmod +x sync_fusion_tasks.sh
          bash sync_fusion_tasks.sh

      - name: Sync growth_os.db to GCS
        run: |
          echo "GCS sync handled by local cron (6hr interval)"