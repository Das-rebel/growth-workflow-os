name: Sync Fusion Tasks
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            strategic_memory/
          sparse-checkout-cone-mode: false

      - name: Sync content drafts DB to GCS
        run: |
          echo "=== Syncing growth_os.db to GCS ==="
          ls -la strategic_memory/
          gsutil cp strategic_memory/growth_os.db gs://growth-os-db-338789220059/growth_os.db 2>&1 || \
          echo "GCS sync requires credentials — handled by local cron"

      - name: Verify content drafts in DB
        run: |
          echo "=== Content Drafts in growth_os.db ==="
          sqlite3 strategic_memory/growth_os.db "SELECT id, platform, topic, status FROM content_drafts ORDER BY id DESC LIMIT 10;" 2>/dev/null || \
          echo "sqlite3 not available"