name: Sync Fusion Tasks
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            strategic_memory/
          sparse-checkout-cone-mode: false

      - name: Check DB status
        run: |
          echo "=== growth_os.db status ==="
          ls -la strategic_memory/*.db 2>/dev/null || echo "No .db files in strategic_memory (gitignored)"
          echo "GCS sync is handled by local cron (6hr interval) + push-triggered sync"
          echo "Telegram bot reads directly from GCS: gs://growth-os-db-338789220059/growth_os.db"

      - name: Verify content drafts exist locally
        if: always()
        run: |
          echo "=== Content Drafts check ==="
          # The DB file is gitignored — verify by checking if it exists locally
          if [ -f "strategic_memory/growth_os.db" ]; then
            echo "Found: strategic_memory/growth_os.db (gitignored — tracked locally)"
          else
            echo "DB not in git — local cron handles GCS sync"
          fi