# Model Routing Configuration
# Primary: MiniMax M2.7 (fast, cheap, working)
# Fallback: Mistral Small (working)
# API keys from environment: MINIMAX_API_KEY, MISTRAL_API_KEY

models:
  strategic_inference:
    model: "openai/MiniMax-M2.7"
    fallback: "mistral/mistral-small-latest"
    api_base: "https://api.minimaxi.chat/v1"
    temperature: 0.7
    max_tokens: 4000

  signal_interpretation:
    model: "openai/MiniMax-M2.7"
    fallback: "mistral/mistral-small-latest"
    api_base: "https://api.minimaxi.chat/v1"
    temperature: 0.3
    max_tokens: 2000

  memo_generation:
    model: "openai/MiniMax-M2.7"
    fallback: "mistral/mistral-small-latest"
    api_base: "https://api.minimaxi.chat/v1"
    temperature: 0.5
    max_tokens: 6000

  workflow_redesign:
    model: "openai/MiniMax-M2.7"
    fallback: "mistral/mistral-small-latest"
    api_base: "https://api.minimaxi.chat/v1"
    temperature: 0.4
    max_tokens: 3000

  org_implication:
    model: "openai/MiniMax-M2.7"
    fallback: "mistral/mistral-small-latest"
    api_base: "https://api.minimaxi.chat/v1"
    temperature: 0.5
    max_tokens: 3000

pipeline:
  max_signals_per_run: 50
  signal_dedup_window_hours: 48
  inference_batch_size: 10
  memo_output_dir: "operating_memos/output"

memory:
  db_path: "strategic_memory/growth_os.db"
